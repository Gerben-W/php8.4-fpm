name: Publish DockerHub image

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'

jobs:
  build-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # ----------------------------
      # 1. Extract base image from Dockerfile
      # ----------------------------
      - name: Extract base image
        id: base
        run: |
          BASE_IMAGE=$(grep -m 1 '^FROM' Dockerfile | awk '{print $2}')
          echo "Base image: $BASE_IMAGE"
          echo "base=$BASE_IMAGE" >> $GITHUB_OUTPUT

      # ----------------------------
      # 2. Get current digest of base image
      # ----------------------------
      - name: Get base image digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ${{ steps.base.outputs.base }} \
            | grep -m1 Digest \
            | awk '{print $2}')

          echo "Digest: $DIGEST"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      # ----------------------------
      # 3. Load previous digest (cache)
      # ----------------------------
      - name: Load cached base digest
        id: cache
        uses: actions/cache@v4
        with:
          path: .base-digest
          key: base-digest-${{ github.repository }}

      # ----------------------------
      # 4. Compare digests
      # ----------------------------
      - name: Check if base image changed
        id: check
        run: |
          OLD=$(cat .base-digest 2>/dev/null || echo "")
          NEW="${{ steps.digest.outputs.digest }}"

          echo "Old digest: $OLD"
          echo "New digest: $NEW"

          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "$NEW" > .base-digest
          fi

      # ----------------------------
      # 5. Skip if no change
      # ----------------------------
      - name: Skip build if base image unchanged
        if: steps.check.outputs.changed == 'false'
        run: echo "No base image change → skipping build."

      # ----------------------------
      # 6. Login to DockerHub
      # ----------------------------
      - name: Login to DockerHub
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # ----------------------------
      # 7. Extract metadata
      # ----------------------------
      - name: Extract metadata
        if: steps.check.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: capino/${{ github.event.repository.name }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      # ----------------------------
      # 8. Build and push image
      # ----------------------------
      - name: Build and push
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ----------------------------
      # 9. Save updated digest
      # ----------------------------
      - name: Save base digest
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.digest.outputs.digest }}" > .base-digest

      # ----------------------------
      # 10. Commit updated digest
      # ----------------------------
      - name: Commit digest update
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .base-digest
          git commit -m "chore: update base image digest"
          git push